<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eldi Trimi App Portfolio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1016" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<script async src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
<style id="pf-style">
:root{
  /* Layout: a holdings register. Portfolio summary and allocation bar on top, app tiles grouped by industry below; Present turns each holding into a full-bleed slide on a dark stage. */
  --bg:#F2F3F6;
  --surface:#FFFFFF;
  --sunken:#E8EAF0;
  --ink:#11141B;
  --muted:#586072;
  --line:#DADDE5;
  --accent:#2B44E0;
  --accent-ink:#FFFFFF;
  --icon-ink:#FFFFFF;
  --ok:#157A46; --ok-soft:#E1F2E8;
  --warn:#9C5A00; --warn-soft:#FAEED8;
  --dev:#34599A; --dev-soft:#E3EAF6;
  --idle:#636A78; --idle-soft:#E9EAEE;
  --danger:#B42318; --danger-soft:#FDECEA;
  --cat-1:#2B44E0; --cat-2:#CF4A2A; --cat-3:#0A806F; --cat-4:#7443CC; --cat-5:#A77508; --cat-6:#46618A;
  --shadow:0 1px 2px rgb(17 20 27 / 6%), 0 12px 28px -16px rgb(17 20 27 / 28%);
  /* The presentation stage is deliberately dark in both themes */
  --stage-bg:#0A0C11; --stage-panel:#121620; --stage-fg:#F3F4F7; --stage-muted:#8E95A6; --stage-line:#252A37;
  --stage-cat-1:#8292FF; --stage-cat-2:#FF8566; --stage-cat-3:#3FC7B1; --stage-cat-4:#B18FFF; --stage-cat-5:#EDBB4E; --stage-cat-6:#93AACC;
  --stage-ok:#4CC486; --stage-ok-soft:#12291E; --stage-warn:#F0B35A; --stage-warn-soft:#2D2312;
  --stage-dev:#8FB0EA; --stage-dev-soft:#172236; --stage-idle:#A3A9B6; --stage-idle-soft:#1E222B;
  --qr-bg:#FFFFFF; --qr-ink:#0A0C11;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --f-body:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1016; --surface:#171A22; --sunken:#1F232D; --ink:#ECEEF3; --muted:#9AA1B2; --line:#2A2F3B;
    --accent:#8C9BFF; --accent-ink:#0E1016; --icon-ink:#0E1016;
    --ok:#4CC486; --ok-soft:#14291F; --warn:#F0B35A; --warn-soft:#2E2413; --dev:#8FB0EA; --dev-soft:#1A2436; --idle:#A3A9B6; --idle-soft:#23262E;
    --danger:#FF8A7A; --danger-soft:#33191A;
    --cat-1:#8C9BFF; --cat-2:#FF8566; --cat-3:#3FC7B1; --cat-4:#B18FFF; --cat-5:#EDBB4E; --cat-6:#93AACC;
    --shadow:0 1px 2px rgb(0 0 0 / 40%), 0 14px 30px -16px rgb(0 0 0 / 70%);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1016; --surface:#171A22; --sunken:#1F232D; --ink:#ECEEF3; --muted:#9AA1B2; --line:#2A2F3B;
  --accent:#8C9BFF; --accent-ink:#0E1016; --icon-ink:#0E1016;
  --ok:#4CC486; --ok-soft:#14291F; --warn:#F0B35A; --warn-soft:#2E2413; --dev:#8FB0EA; --dev-soft:#1A2436; --idle:#A3A9B6; --idle-soft:#23262E;
  --danger:#FF8A7A; --danger-soft:#33191A;
  --cat-1:#8C9BFF; --cat-2:#FF8566; --cat-3:#3FC7B1; --cat-4:#B18FFF; --cat-5:#EDBB4E; --cat-6:#93AACC;
  --shadow:0 1px 2px rgb(0 0 0 / 40%), 0 14px 30px -16px rgb(0 0 0 / 70%);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.presenting{overflow:hidden}
.cat-1{--c:var(--cat-1)} .cat-2{--c:var(--cat-2)} .cat-3{--c:var(--cat-3)} .cat-4{--c:var(--cat-4)} .cat-5{--c:var(--cat-5)} .cat-6{--c:var(--cat-6)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Page */
.page{max-width:1180px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px);padding-block:clamp(22px,4vw,40px) 48px}
.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px 24px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand-mark{display:grid;grid-template-columns:repeat(2,15px);gap:4px;flex:none}
.brand-mark i{width:15px;height:15px;border-radius:5px;background:var(--cat-1)}
.brand-mark i:nth-child(2){background:var(--cat-2)}
.brand-mark i:nth-child(3){background:var(--cat-3)}
.brand-mark i:nth-child(4){background:var(--sunken);box-shadow:inset 0 0 0 1.5px var(--line)}
.brand-text{min-width:0}
.eyebrow{margin:0 0 6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-size:clamp(32px,5.2vw,50px);font-weight:720;line-height:.98;letter-spacing:-.035em;text-wrap:balance;font-variation-settings:"opsz" 96}
.masthead-actions{display:flex;flex-wrap:wrap;gap:8px}
.subtitle{max-width:62ch;margin:14px 0 0;color:var(--muted);font-size:16px;line-height:1.55;text-wrap:pretty}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14.5px;font-weight:600;line-height:1;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s ease, filter .15s ease, border-color .15s ease}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--danger-soft)}
.btn.solid-danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.edit-only{display:none!important}
.can-edit .edit-only{display:inline-flex!important}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

/* Summary */
.summary{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px 48px;align-items:end;margin-top:28px;padding-block:22px;border-block:1px solid var(--line)}
.stats{display:flex;flex-wrap:wrap;gap:14px 34px;margin:0}
.stat dt{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat dd{margin:6px 0 0;font-family:var(--f-display);font-size:36px;font-weight:650;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.alloc{min-width:0}
.alloc-head{display:flex;justify-content:space-between;gap:12px}
.alloc-bar{display:flex;gap:3px;height:10px;margin:10px 0 12px}
.alloc-bar span{flex:1 1 0;min-width:6px;border-radius:3px;background:var(--c)}
.alloc-legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13.5px;color:var(--muted)}
.alloc-legend li{display:inline-flex;align-items:center;gap:8px}
.alloc-legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c, var(--muted));flex:none}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin:24px 0 30px}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search svg{position:absolute;left:13px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:42px;padding:0 14px 0 38px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.search input::placeholder{color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.seg .label{margin-right:8px}
.seg button{height:34px;padding:0 12px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(17 20 27 / 6%)}

/* Groups and tiles */
#groups{display:grid;gap:38px}
.group{display:grid;gap:16px}
.group-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.group-head h2{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--f-display);font-size:22px;font-weight:650;letter-spacing:-.015em}
.group-count{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(250px, calc((100% - 28px) / 3)),1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--c)}
.tile:has(.tile-link:focus-visible){outline:2px solid var(--c);outline-offset:2px}
.tile-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.app-icon{--s:50px;display:grid;place-items:center;flex:none;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .27);background-color:var(--c);background-image:linear-gradient(150deg, rgb(255 255 255 / 24%), rgb(255 255 255 / 0%) 58%);box-shadow:inset 0 0 0 1px rgb(255 255 255 / 12%);color:var(--icon-ink);font-family:var(--f-display);font-size:calc(var(--s) * .38);font-weight:760;letter-spacing:-.03em;line-height:1;user-select:none}
.app-icon.lg{--s:60px}
.app-icon.sm{--s:40px}
.app-icon.xl{--s:92px}
.tile-name{margin:4px 0 0;font-family:var(--f-display);font-size:20px;font-weight:650;line-height:1.15;letter-spacing:-.015em}
.tile-link{padding:0;border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-align:left;text-decoration:none;cursor:pointer}
.tile-link::after{content:"";position:absolute;inset:0;border-radius:inherit}
.tile-link:focus-visible{outline:none}
.tile-tag{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45}
.tile-meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin:0;color:var(--muted);font-size:12.5px}
.tile-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.host{min-width:0;font-family:var(--f-mono);font-size:12px;color:var(--ink);overflow-wrap:anywhere}
.host .arr{color:var(--c)}
.host.none{color:var(--muted)}
.tile-info{position:relative;z-index:1;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;flex:none}
.tile-info:hover{color:var(--ink);border-color:var(--c)}

/* Status pills */
.pill{--pill:var(--idle);--pill-soft:var(--idle-soft);display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--pill-soft);color:var(--pill);font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.s-live{--pill:var(--ok);--pill-soft:var(--ok-soft)}
.s-beta{--pill:var(--warn);--pill-soft:var(--warn-soft)}
.s-dev{--pill:var(--dev);--pill-soft:var(--dev-soft)}
.s-concept i,.s-paused i{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.group.st-live .dot{background:var(--ok)} .group.st-beta .dot{background:var(--warn)} .group.st-dev .dot{background:var(--dev)}

.empty{display:grid;justify-items:center;gap:12px;padding:44px 24px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:20px;font-weight:650}
.empty p{margin:0;max-width:46ch}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;margin-top:52px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}

/* Sheets */
dialog.sheet{width:min(660px, calc(100vw - 32px));max-width:none;max-height:calc(100dvh - 48px);padding:0;border:0;border-radius:22px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);overflow:hidden}
dialog.sheet[open]{display:flex;flex-direction:column}
dialog.sheet::backdrop{background:rgb(8 10 14 / 50%);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet-form,.sheet-wrap{display:flex;flex-direction:column;min-height:0;max-height:inherit;flex:1}
.sheet-head{display:flex;align-items:flex-start;gap:16px;padding:22px 22px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-family:var(--f-display);font-size:24px;font-weight:680;line-height:1.1;letter-spacing:-.02em}
.sheet-title{flex:1;min-width:0}
.sheet-title .eyebrow{margin-bottom:6px}
.d-tag{margin:6px 0 0;color:var(--muted);font-size:15px}
.sheet-body{flex:1;min-height:0;overflow:auto;padding:20px 22px;display:grid;gap:18px;align-content:start}
.sheet-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 22px calc(16px + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .grow{flex:1}
.form-msg{margin:0;color:var(--danger);font-size:13.5px;font-weight:500}
.form-msg.ok{color:var(--ok)}
.form-msg:empty{display:none}
.d-desc{margin:0;font-size:15.5px;line-height:1.6;max-width:62ch}
.d-features{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.d-features li{display:grid;grid-template-columns:10px 1fr;gap:12px;align-items:baseline;font-size:14.5px}
.d-features li::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c);transform:translateY(-1px)}
.d-meta{display:grid;margin:0;border-top:1px solid var(--line)}
.d-meta div{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.d-meta dt{padding-top:2px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.d-meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.d-meta a{color:var(--ink);text-decoration-color:var(--line);text-underline-offset:3px}
.link-field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:var(--f-mono);font-size:13px}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.span2{grid-column:1 / -1}
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field > span{font-size:12.5px;font-weight:600;color:var(--muted)}
.field > span em{font-style:normal;font-weight:400}
.field input,.field select,.field textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;line-height:1.4}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.err{color:var(--danger);font-size:12.5px;font-weight:500}
.check{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.confirm{display:grid;gap:10px;margin:0 22px;padding:14px 16px;border-radius:12px;background:var(--danger-soft);color:var(--ink);font-size:14.5px}
.confirm p{margin:0}
.confirm .row{display:flex;flex-wrap:wrap;gap:8px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));z-index:70;max-width:calc(100vw - 32px);padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;box-shadow:var(--shadow);transform:translate(-50%, 8px);opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease}
.toast.show{opacity:1;transform:translate(-50%, 0)}

/* Presentation stage */
.stage{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);background:var(--stage-bg);color:var(--stage-fg);font-family:var(--f-body);color-scheme:dark;outline:none;
  --ok:var(--stage-ok); --ok-soft:var(--stage-ok-soft); --warn:var(--stage-warn); --warn-soft:var(--stage-warn-soft);
  --dev:var(--stage-dev); --dev-soft:var(--stage-dev-soft); --idle:var(--stage-idle); --idle-soft:var(--stage-idle-soft);
  --icon-ink:var(--stage-bg); --accent:var(--stage-fg)}
.stage .cat-1{--c:var(--stage-cat-1)} .stage .cat-2{--c:var(--stage-cat-2)} .stage .cat-3{--c:var(--stage-cat-3)} .stage .cat-4{--c:var(--stage-cat-4)} .stage .cat-5{--c:var(--stage-cat-5)} .stage .cat-6{--c:var(--stage-cat-6)}
.stage-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:16px clamp(16px,4vw,48px)}
.stage-brand{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--stage-muted)}
.stage-count{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--stage-muted);font-variant-numeric:tabular-nums}
.stage-body{display:grid;min-height:0;overflow:auto;padding-inline:clamp(16px,5vw,72px);touch-action:pan-y}
.stage-nav{display:flex;align-items:center;gap:16px;padding:14px clamp(16px,4vw,48px) 18px}
.stage-progress{flex:1;height:3px;border-radius:3px;background:var(--stage-line);overflow:hidden}
.stage-progress i{display:block;width:0;height:100%;background:var(--stage-fg);transition:width .35s ease}
.st-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 13px;border:1px solid var(--stage-line);border-radius:10px;background:transparent;color:var(--stage-fg);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.st-btn:hover{background:var(--stage-panel)}
.st-btn:disabled{opacity:.3;cursor:default}
.stage :focus-visible{outline-color:var(--stage-fg)}

.slide{align-self:center;width:100%;max-width:1240px;margin-inline:auto;padding-block:20px 32px;animation:slide-in .5s cubic-bezier(.2,.7,.2,1)}

    byId('edit-title').textContent = a ? 'Edit ' + a.name : 'Add an app';
    setVal('f-name', a ? a.name : '');
    setVal('f-url', a ? a.url : '');
    setVal('f-tagline', a ? a.tagline : '');
    setVal('f-desc', a ? a.description : '');
    setVal('f-industry', a ? a.industry : '');
    setVal('f-type', a ? a.type : 'iPhone web app');
    setVal('f-status', a ? a.status : 'Live');
    setVal('f-client', a ? a.client : '');
    setVal('f-platform', a ? a.platform : 'iPhone Home Screen, Vercel');
    setVal('f-since', a ? a.since : todayISO().slice(0, 7));
    setVal('f-stack', a ? a.stack : '');
    setVal('f-features', a ? a.features.join('\n') : '');
    setVal('f-repo', a ? a.repo : '');
    setVal('f-mark', a ? a.mark : '');
    byId('f-present').checked = a ? a.present : true;
    byId('btn-delete').hidden = !a;
    byId('del-confirm').hidden = true;
    byId('err-name').hidden = true;
    byId('err-url').hidden = true;
    byId('edit-msg').textContent = '';
    fillDatalist('dl-industry', BASE_INDUSTRIES, 'industry');
    fillDatalist('dl-type', BASE_TYPES, 'type');
    fillDatalist('dl-client', BASE_CLIENTS, 'client');
    closeDialog('dlg-detail');
    openDialog('dlg-edit');
    setTimeout(function () { try { byId('f-name').focus(); } catch (e) { /* ignore */ } }, 40);
  }
  function openSettings() {
    setVal('s-title', state.settings.title);
    setVal('s-owner', state.settings.owner);
    setVal('s-subtitle', state.settings.subtitle);
    byId('set-msg').textContent = '';
    openDialog('dlg-settings');
  }
  function setBusy(on) {
    busy = on;
    [['btn-save', 'Save app', 'Saving…'], ['btn-save-settings', 'Save details', 'Saving…'], ['del-go', 'Delete app', 'Deleting…']].forEach(function (b) {
      var el = byId(b[0]);
      if (!el) return;
      el.disabled = on;
      el.textContent = on ? b[2] : b[1];
    });
  }

  byId('edit-form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    var name = val('f-name');
    byId('err-name').hidden = !!name;
    if (!name) { byId('f-name').focus(); return; }
    var url = normalizeUrl(byId('f-url').value);
    byId('err-url').hidden = url !== null;
    if (url === null) { byId('f-url').focus(); return; }
    var next = clone(state);
    var app = {
      id: editingId || uid(),
      no: 0,
      name: name,
      mark: val('f-mark'),
      tagline: val('f-tagline'),
      description: val('f-desc'),
      url: url,
      industry: val('f-industry') || 'Other',
      type: val('f-type') || 'Web app',
      status: byId('f-status').value,
      client: val('f-client'),
      platform: val('f-platform'),
      stack: val('f-stack'),
      since: val('f-since'),
      features: byId('f-features').value.split(/\n+/).map(str).filter(Boolean).slice(0, 6),
      repo: val('f-repo').replace(/^https?:\/\/github\.com\//i, '').replace(/\/+$/, ''),
      present: byId('f-present').checked
    };
    var idx = -1;
    next.apps.forEach(function (x, i) { if (x.id === editingId) idx = i; });
    if (idx !== -1) { app.no = next.apps[idx].no; next.apps[idx] = app; }
    else { app.no = next.apps.reduce(function (m, x) { return Math.max(m, x.no); }, 0) + 1; next.apps.push(app); }
    next.updated = todayISO();
    commit(next, (idx !== -1 ? 'Saved changes to ' : 'Added ') + name);
  });
  byId('btn-delete').addEventListener('click', function () {
    var a = findApp(editingId);
    if (!a) return;
    byId('del-text').textContent = 'Delete ' + a.name + '? It will be removed from the portfolio and the presentation.';
    byId('del-confirm').hidden = false;
    byId('del-go').focus();
  });
  byId('del-keep').addEventListener('click', function () { byId('del-confirm').hidden = true; });
  byId('del-go').addEventListener('click', function () {
    if (busy) return;
    var a = findApp(editingId);
    if (!a) return;
    var next = clone(state);
    next.apps = next.apps.filter(function (x) { return x.id !== a.id; });
    next.updated = todayISO();
    commit(next, 'Deleted ' + a.name);
  });
  byId('settings-form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    var next = clone(state);
    next.settings = { title: val('s-title') || 'App Portfolio', owner: val('s-owner'), subtitle: val('s-subtitle') };
    next.updated = todayISO();
    commit(next, 'Saved portfolio details');
  });

  /* ---------- Saving ---------- */
  function buildDocument(s) {
    var json = JSON.stringify(s, null, 1)
      .replace(/</g, '\\u003c')
      .split(String.fromCharCode(0x2028)).join('\\u2028')
      .split(String.fromCharCode(0x2029)).join('\\u2029');
    return SKELETON_OPEN +
      '<title>' + esc(PAGE_TITLE) + '</title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link rel="stylesheet" href="' + FONT_HREF.replace(/&/g, '&amp;') + '">\n' +
      OPEN_SCRIPT + ' async src="' + QR_SRC + '">' + SC + '\n' +
      '<style id="pf-style">' + byId('pf-style').textContent + '</style>\n' +
      '<template id="pf-shell">' + byId('pf-shell').innerHTML + '</template>\n' +
      '<div id="app"></div>\n' +
      OPEN_SCRIPT + ' type="application/json" id="pf-data">' + json + SC + '\n' +
      OPEN_SCRIPT + ' id="pf-app">' + byId('pf-app').textContent + SC + '\n' +
      SKELETON_CLOSE;
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function publishOnce(html, retries) {
    return artifactNS.publish(html).catch(function (err) {
      var code = err && err.code;
      var retryable = code === 'upstream_error' || KNOWN_CODES.indexOf(code) === -1;
      if (retries > 0 && retryable) return wait(500 + Math.random() * 800).then(function () { return publishOnce(html, retries - 1); });
      throw err;
    });
  }
  function handleSaveError(err) {
    var code = err && err.code;
    if (code === 'conflict') { notify('A newer version was saved a moment ago. Loading it now.'); return; }
    if (READ_ONLY_CODES.indexOf(code) !== -1) {
      mode = 'readonly';
      closeAllDialogs();
      renderAll();
      toast('This portfolio is view only for you, so changes can’t be saved.');
      return;
    }
    if (code === 'rate_limited') { notify('Too many saves in a row. Wait a few seconds, then save again.'); return; }
    if (code === 'too_large') { notify('The portfolio is too large to save. Shorten some descriptions, then save again.'); return; }
    notify('Couldn’t save right now. Your changes are still here, so try saving again.');
  }
  function commit(next, msg) {
    next = normalize(next);
    if (mode === 'artifact' && artifactNS) {
      setBusy(true);
      ssSet(FLASH_KEY, msg + '.');
      publishOnce(buildDocument(next), 1).then(function () {
        state = next; /* the page reloads to the new version */
      }, function (err) {
        ssTake(FLASH_KEY);
        setBusy(false);
        handleSaveError(err);
      });
      return;
    }
    if (mode === 'local') {
      if (!lsSet(LOCAL_KEY, { base: FILE_STAMP, data: next })) { notify('Couldn’t save on this device. Browser storage is full or turned off.'); return; }
      state = next;
      closeAllDialogs();
      renderAll();
      toast(msg + '.');
      return;
    }
    notify('This portfolio is view only, so changes can’t be saved here.');
  }

  /* ---------- Presentation ---------- */
  var stageEl = byId('stage');
  var stageBody = byId('stage-body');
  var deck = [], cur = 0, lastFocus = null, qrTimer = null;

  function presentable() { return state.apps.filter(function (a) { return a.present; }); }
  function industriesLabel(n) { return plural(n, 'industry', 'industries'); }
  function buildDeck() {
    var apps = presentable();
    var ordered = [];
    groupsOf(apps, 'industry').forEach(function (g) { ordered = ordered.concat(g.apps); });
    var d = [{ kind: 'cover', apps: apps }];
    if (apps.length) {
      d.push({ kind: 'index', apps: ordered });
      ordered.forEach(function (a) { d.push({ kind: 'app', app: a }); });
      d.push({ kind: 'next', apps: ordered });
    }
    return d;
  }
  function kpi(label, n) { return '<div><dt>' + esc(label) + '</dt><dd>' + n + '</dd></div>'; }
  function coverHTML(apps) {
    var colors = industryColors();
    var inds = groupsOf(apps, 'industry');
    var live = apps.filter(isLive).length;
    var now = new Date();
    var st = state.settings;
    var alloc = apps.length
      ? '<div class="s-alloc"><p class="s-label">Allocation by industry</p>' +
          '<div class="s-alloc-bar">' + inds.map(function (g) { return '<span class="cat-' + colors[g.key] + '" style="flex-grow:' + g.apps.length + '"></span>'; }).join('') + '</div>' +
          '<ul class="s-alloc-legend">' + inds.map(function (g) {
            return '<li class="cat-' + colors[g.key] + '"><i aria-hidden="true"></i><span><b>' + esc(g.key) + '</b> · ' + g.apps.length +
              '<small>' + esc(g.apps.map(function (a) { return a.name; }).join(', ')) + '</small></span></li>';
          }).join('') + '</ul></div>'
      : '<p class="s-desc">Add apps to the portfolio and they appear here.</p>';
    return '<section class="slide slide-cover">' +
      '<p class="s-eyebrow">Portfolio review · ' + MONTHS_LONG[now.getMonth()] + ' ' + now.getFullYear() + '</p>' +
      '<h2 class="s-mega">' + esc(st.title) + '</h2>' +
      (st.subtitle ? '<p class="s-lede">' + esc(st.subtitle) + '</p>' : '') +
      (st.owner ? '<p class="s-by">Presented by <strong>' + esc(st.owner) + '</strong></p>' : '') +
      '<dl class="s-kpis">' + kpi('Apps', apps.length) + kpi('Live', live) + kpi('In the works', apps.length - live) + kpi('Industries', inds.length) + '</dl>' +
      alloc +
    '</section>';
  }
  function indexHTML(apps) {
    var colors = industryColors();
    var inds = groupsOf(apps, 'industry').length;
    return '<section class="slide slide-index">' +
      '<p class="s-eyebrow">The portfolio at a glance</p>' +
      '<h2 class="s-title">' + plural(apps.length, 'app') + ' across ' + industriesLabel(inds) + '</h2>' +
      '<div class="s-table-wrap"><table class="s-table"><thead><tr><th>App</th><th>Industry</th><th class="hide-sm">Built for</th><th>Status</th><th class="hide-sm">Since</th></tr></thead><tbody>' +
      apps.map(function (a) {
        return '<tr class="cat-' + (colors[a.industry] || 1) + '">' +
          '<td><div class="s-app"><span class="app-icon sm" aria-hidden="true">' + esc(markOf(a)) + '</span><span><b>' + esc(a.name) + '</b>' + (a.tagline ? '<small>' + esc(a.tagline) + '</small>' : '') + '</span></div></td>' +
          '<td><span class="s-ind"><i aria-hidden="true"></i>' + esc(a.industry) + '</span></td>' +
          '<td class="hide-sm">' + esc(a.client) + '</td>' +
          '<td>' + pillHTML(a.status) + '</td>' +
          '<td class="num hide-sm">' + esc(fmtSince(a.since)) + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>' +
    '</section>';
  }
  function appSlideHTML(a) {
    var colors = industryColors();
    var meta = [['Built for', a.client], ['Type', a.type], ['Platform', a.platform], ['Tech stack', a.stack], ['Since', fmtSince(a.since)]]
      .filter(function (r) { return r[1]; });
    var open = a.url
      ? '<div class="s-open"><div class="qr" data-qr="' + esc(a.url) + '"></div><div class="s-open-text">' +
          '<p class="s-scan">Scan to open on your phone</p><p class="s-host">' + esc(hostOf(a.url)) + '</p>' +
          '<a class="s-btn" href="' + esc(a.url) + '" target="_blank" rel="noopener">Open live app ↗</a></div></div>'
      : '<p class="s-nolink">Not published yet. The link appears here once it goes live.</p>';
    return '<section class="slide slide-app cat-' + (colors[a.industry] || 1) + '">' +
      '<div class="s-main">' +
        '<p class="s-eyebrow"><span class="s-ind"><i aria-hidden="true"></i>' + esc(a.industry) + '</span><span aria-hidden="true">/</span><span>No. ' + pad2(a.no) + '</span></p>' +
        '<h2 class="s-name">' + esc(a.name) + '</h2>' +
        (a.tagline ? '<p class="s-tag">' + esc(a.tagline) + '</p>' : '') +
        (a.description ? '<p class="s-desc">' + esc(a.description) + '</p>' : '') +
        (a.features.length ? '<ul class="s-feats">' + a.features.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>' : '') +
      '</div>' +
      '<aside class="s-side">' +
        '<div class="s-side-head"><span class="app-icon xl" aria-hidden="true">' + esc(markOf(a)) + '</span>' + pillHTML(a.status) + '</div>' +
        (meta.length ? '<dl class="s-meta">' + meta.map(function (r) { return '<div><dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('') + '</dl>' : '') +
        open +
      '</aside>' +
    '</section>';
  }
  function nextHTML(apps) {
    var colors = industryColors();
    var live = apps.filter(isLive).length;
    var pipe = apps.filter(function (a) { return !isLive(a); });
    var owner = state.settings.owner;
    var list = pipe.length
      ? '<ul class="s-pipe">' + pipe.map(function (a) {
          return '<li class="cat-' + (colors[a.industry] || 1) + '"><span class="app-icon sm" aria-hidden="true">' + esc(markOf(a)) + '</span>' +
            '<span><b>' + esc(a.name) + '</b><small>' + esc(a.tagline || a.industry) + '</small></span>' + pillHTML(a.status) + '</li>';
        }).join('') + '</ul>'
      : '';
    return '<section class="slide slide-next">' +
      '<p class="s-eyebrow">What’s next</p>' +
      '<h2 class="s-title">' + (pipe.length ? 'In the works' : 'Every app is live') + '</h2>' +
      list +
      '<p class="s-close"><strong>' + live + ' live</strong> today' + (pipe.length ? ', <strong>' + pipe.length + ' in the works</strong>' : '') + '.' +
        (owner ? ' Built and run by ' + esc(owner) + '.' : '') + ' Thank you.</p>' +
    '</section>';
  }
  function slideHTML(s) {
    if (s.kind === 'cover') return coverHTML(s.apps);
    if (s.kind === 'index') return indexHTML(s.apps);
    if (s.kind === 'app') return appSlideHTML(s.app);
    return nextHTML(s.apps);
  }
  function qrSVG(text) {
    if (typeof window.qrcode !== 'function') return '';
    try {
      var q = window.qrcode(0, 'M');
      q.addData(text);
      q.make();
      var n = q.getModuleCount(), d = '';
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
      return '<svg viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges" role="img" aria-label="QR code for ' + esc(hostOf(text)) + '">' +
        '<rect width="' + n + '" height="' + n + '" fill="#FFFFFF" style="fill:var(--qr-bg)"/><path d="' + d + '" fill="#0A0C11" style="fill:var(--qr-ink)"/></svg>';
    } catch (e) { return ''; }
  }
  function drawQRs(tries) {
    clearTimeout(qrTimer);
    var pending = false;
    Array.prototype.slice.call(stageBody.querySelectorAll('[data-qr]')).forEach(function (el) {
      if (el.firstChild) return;
      var svg = qrSVG(el.getAttribute('data-qr'));
      if (svg) el.innerHTML = svg; else pending = true;
    });
    if (pending && tries < 12) qrTimer = setTimeout(function () { drawQRs(tries + 1); }, 500);
  }
  function renderSlide(dir) {
    var s = deck[cur];
    stageBody.innerHTML = slideHTML(s);
    var el = stageBody.firstElementChild;
    if (el) el.style.setProperty('--dir', dir < 0 ? '-24px' : '24px');
    byId('stage-count').textContent = pad2(cur + 1) + ' / ' + pad2(deck.length);
    byId('stage-bar').style.width = ((cur + 1) / deck.length * 100) + '%';
    byId('st-prev').disabled = cur === 0;
    byId('st-next').disabled = cur === deck.length - 1;
    stageBody.scrollTop = 0;
    drawQRs(0);
  }
  function go(step) {
    var n = Math.max(0, Math.min(deck.length - 1, cur + step));
    if (n === cur) return;
    cur = n;
    renderSlide(step);
  }
  function fullscreenSupported() { return !!(stageEl.requestFullscreen || stageEl.webkitRequestFullscreen); }
  function enterFullscreen() {
    try {
      var p = stageEl.requestFullscreen ? stageEl.requestFullscreen() : (stageEl.webkitRequestFullscreen && stageEl.webkitRequestFullscreen());
      if (p && typeof p.catch === 'function') p.catch(function () { /* optional */ });
    } catch (e) { /* optional */ }
  }
  function exitFullscreen() {
    try {
      if (document.fullscreenElement && document.exitFullscreen) { var p = document.exitFullscreen(); if (p && p.catch) p.catch(function () {}); }
      else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch (e) { /* optional */ }
  }
  function syncFullBtn() {
    var on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    byId('st-full').textContent = on ? 'Exit full screen' : 'Full screen';
  }
  function openStage() {
    lastFocus = document.activeElement;
    deck = buildDeck();
    cur = 0;
    var st = state.settings;
    byId('stage-brand').textContent = [st.owner, st.title].filter(Boolean).join(' · ');
    byId('st-full').hidden = !fullscreenSupported();
    stageEl.hidden = false;
    document.body.classList.add('presenting');
    renderSlide(1);
    try { stageEl.focus({ preventScroll: true }); } catch (e) { stageEl.focus(); }
    if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) enterFullscreen();
    syncFullBtn();
  }
  function closeStage() {
    exitFullscreen();
    stageEl.hidden = true;
    document.body.classList.remove('presenting');
    clearTimeout(qrTimer);
    if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
  }
  byId('st-prev').addEventListener('click', function () { go(-1); });
  byId('st-next').addEventListener('click', function () { go(1); });
  byId('st-close').addEventListener('click', closeStage);
  byId('st-full').addEventListener('click', function () {
    if (document.fullscreenElement || document.webkitFullscreenElement) exitFullscreen(); else enterFullscreen();
  });
  document.addEventListener('fullscreenchange', syncFullBtn);
  document.addEventListener('webkitfullscreenchange', syncFullBtn);
  document.addEventListener('keydown', function (e) {
    if (stageEl.hidden) return;
    var t = e.target, tag = t && t.tagName;
    var onControl = tag === 'BUTTON' || tag === 'A' || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === 'ArrowDown' && !onControl) { e.preventDefault(); go(1); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp' && !onControl) { e.preventDefault(); go(-1); }
    else if ((k === ' ' || k === 'Enter') && !onControl) { e.preventDefault(); go(e.shiftKey ? -1 : 1); }
    else if (k === 'Home') { e.preventDefault(); go(-deck.length); }
    else if (k === 'End') { e.preventDefault(); go(deck.length); }
    else if (k === 'Escape') { e.preventDefault(); closeStage(); }
    else if ((k === 'f' || k === 'F') && !onControl && fullscreenSupported()) { e.preventDefault(); if (document.fullscreenElement || document.webkitFullscreenElement) exitFullscreen(); else enterFullscreen(); }
  });
  var swipeX = null, swipeY = 0;
  stageBody.addEventListener('pointerdown', function (e) { if (e.pointerType === 'mouse') return; swipeX = e.clientX; swipeY = e.clientY; });
  stageBody.addEventListener('pointerup', function (e) {
    if (swipeX === null) return;
    var dx = e.clientX - swipeX, dy = e.clientY - swipeY;
    swipeX = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1);
  });
  stageBody.addEventListener('pointercancel', function () { swipeX = null; });

  /* ---------- Library events ---------- */
  root.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-detail],[data-edit],[data-close],[data-copy],[data-group],#btn-add,#btn-add-empty,#btn-settings,#btn-present') : null;
    if (!t) return;
    if (t.hasAttribute('data-detail')) { e.preventDefault(); openDetail(t.getAttribute('data-detail')); }
    else if (t.hasAttribute('data-edit')) { if (mode !== 'readonly') openEditor(t.getAttribute('data-edit')); }
    else if (t.hasAttribute('data-close')) { if (!busy) { var d = t.closest('dialog'); if (d) closeDialog(d.id); } }
    else if (t.hasAttribute('data-copy')) { copyLink(t.getAttribute('data-copy')); }
    else if (t.hasAttribute('data-group')) {
      ui.group = t.getAttribute('data-group');
      lsSet(UI_KEY, { group: ui.group });
      syncSeg();
      renderGroups();
    }
    else if (t.id === 'btn-add' || t.id === 'btn-add-empty') { if (mode !== 'readonly') openEditor(null); }
    else if (t.id === 'btn-settings') { if (mode !== 'readonly') openSettings(); }
    else if (t.id === 'btn-present') { openStage(); }
  });
  byId('q').addEventListener('input', function (e) { ui.q = e.target.value; renderGroups(); });

  /* ---------- Boot ---------- */
  renderAll();
  var flash = ssTake(FLASH_KEY);
  if (flash) setTimeout(function () { toast(flash); }, 300);

  (function detectMode() {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') {
      // A copy of this page hosted anywhere else: edits live in this browser.
      // A newer published list replaces edits made against an older one.
      var saved = lsGet(LOCAL_KEY);
      if (saved && saved.data && Array.isArray(saved.data.apps)) {
        if (saved.base === FILE_STAMP) state = normalize(saved.data);
        else { try { window.localStorage.removeItem(LOCAL_KEY); } catch (e) { /* ignore */ } setTimeout(function () { toast('Loaded the latest app list.'); }, 400); }
      }
      mode = 'local';
      renderAll();
      return;
    }
    Promise.resolve()
      .then(function () { return c.use('artifact'); })
      .then(function (art) {
        if (!art) return null;
        artifactNS = art;
        return Promise.resolve(c.use('user')).then(function (u) {
          if (!u || typeof u.canEdit !== 'function') return true;
          return u.canEdit().then(function (v) { return v !== false; }, function () { return true; });
        }, function () { return true; });
      })
      .then(function (canWrite) {
        mode = (artifactNS && canWrite) ? 'artifact' : 'readonly';
        renderAll();
      }, function () { mode = 'readonly'; renderAll(); });
  })();
})();
</script>
</body>
</html>
